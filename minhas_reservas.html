<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas Recebidas - Home Sweet Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">Home Sweet Home</a>
        <a href="painel.html" class="btn btn-outline-dark btn-sm">Voltar ao Painel</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Hóspedes Confirmados</h2>
    <div class="card shadow border-0">
        <div class="card-body">
            <table class="table align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Imóvel</th>
                        <th>Hóspede</th>
                        <th>Datas</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-reservas">
                    <tr><td colspan="5" class="text-center">Buscando reservas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://drlnbbodugxkndtpomfa.supabase.co'
    const supabaseKey = 'sb_publishable_uxQbUyjsM-DgKapQzvE32Q_ZUNBtdp1'
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function carregarReservas() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const tbody = document.getElementById('lista-reservas');

        const { data: reservas, error } = await supabase
            .from('reservas')
            .select('*, imoveis(titulo, dono_id)')
            .eq('imoveis.dono_id', user.id)
            .order('data_inicio', { ascending: false });

        tbody.innerHTML = '';

        if (error || !reservas || reservas.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhuma reserva recebida.</td></tr>';
            return;
        }

        // Usando for...of para permitir a busca assíncrona do nome de cada usuário de forma ordenada
        for (const res of reservas) {
            let nomeHospede = 'Hóspede';
            
            if (res.usuario_id) {
                const { data: usr } = await supabase
                    .from('usuarios')
                    .select('nome')
                    .eq('id', res.usuario_id)
                    .maybeSingle();
                if (usr && usr.nome) nomeHospede = usr.nome;
            }

            // CORREÇÃO DO BUG DO FUSO HORÁRIO: Adicionando 'T12:00:00' para não recuar um dia antes
            const dataInicioFormated = new Date(res.data_inicio + 'T12:00:00').toLocaleDateString('pt-BR');
            const dataFimFormated = new Date(res.data_fim + 'T12:00:00').toLocaleDateString('pt-BR');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${res.imoveis?.titulo || 'Imóvel'}</strong></td>
                <td><i class="bi bi-person-fill text-secondary"></i> ${nomeHospede}</td>
                <td>${dataInicioFormated} - ${dataFimFormated}</td>
                <td><span class="badge ${res.status === 'Cancelada' ? 'bg-danger' : 'bg-success'}">${res.status}</span></td>
                <td>
                    <a href="chat.html?imovel_id=${res.imovel_id}&destinatario_id=${res.usuario_id}" class="btn btn-sm btn-primary me-1">
                        <i class="bi bi-chat-dots"></i> Chat
                    </a>
                    ${res.status !== 'Cancelada' ? `<button class="btn btn-danger btn-sm btn-cancelar-hospede" data-id="${res.id}">Cancelar</button>` : ''}
                </td>
            `;
            tbody.appendChild(tr);
        }

        // Reatribui eventos aos botões de cancelar gerados dinamicamente
        document.querySelectorAll('.btn-cancelar-hospede').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(confirm('Cancelar a reserva deste hóspede?')) {
                    const { error: err } = await supabase.from('reservas').update({ status: 'Cancelada' }).eq('id', e.target.dataset.id);
                    if (err) {
                        alert("Erro ao cancelar: " + err.message);
                    } else {
                        carregarReservas();
                    }
                }
            });
        });
    }

    carregarReservas();
</script>
</body>
</html>

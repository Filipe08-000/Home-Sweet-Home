<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Imóvel - Home Sweet Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">Home Sweet Home</a>
        <a href="painel.html" class="btn btn-outline-dark btn-sm">Cancelar</a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 p-4">
                <h2 class="text-center text-primary fw-bold mb-4">Editar Anúncio</h2>
                
                <div id="msg-status"></div>

                <form id="form-editar">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título do Anúncio</label>
                        <input type="text" id="titulo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cidade</label>
                        <input type="text" id="cidade" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição completa</label>
                        <textarea id="descricao" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Preço da Diária (R$)</label>
                        <input type="number" id="preco" class="form-control" step="0.01" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Nova Foto (Opcional)</label>
                        <input type="file" id="foto" class="form-control" accept="image/*">
                        <small class="text-muted">Deixe em branco para manter a imagem atual.</small>
                    </div>

                    <button type="submit" id="btn-salvar" class="btn btn-primary w-100 py-2 fs-5 fw-bold">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://drlnbbodugxkndtpomfa.supabase.co'
    const supabaseKey = 'sb_publishable_uxQbUyjsM-DgKapQzvE32Q_ZUNBtdp1'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const urlParams = new URLSearchParams(window.location.search);
    const imovelId = urlParams.get('id');
    let imagemAtual = null;

    async function carregarDados() {
        if (!imovelId) { window.location.href = 'painel.html'; return; }

        const { data: imovel, error } = await supabase.from('imoveis').select('*').eq('id', imovelId).single();
        if (error) { alert("Erro ao carregar imóvel"); return; }

        document.getElementById('titulo').value = imovel.titulo;
        document.getElementById('cidade').value = imovel.cidade;
        document.getElementById('descricao').value = imovel.descricao;
        document.getElementById('preco').value = imovel.preco_diaria;
        imagemAtual = imovel.imagem;
    }

    document.getElementById('form-editar').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btn-salvar');
        const msgDiv = document.getElementById('msg-status');
        btn.disabled = true;
        btn.innerText = "Salvando...";

        try {
            let nomeArquivo = imagemAtual;
            const fotoFile = document.getElementById('foto').files[0];

            if (fotoFile) {
                nomeArquivo = `${Date.now()}_${fotoFile.name}`;
                const { error: imgError } = await supabase.storage.from('imoveis-imagens').upload(nomeArquivo, fotoFile);
                if (imgError) throw imgError;
            }

            const { error: dbError } = await supabase
                .from('imoveis')
                .update({
                    titulo: document.getElementById('titulo').value,
                    cidade: document.getElementById('cidade').value,
                    descricao: document.getElementById('descricao').value,
                    preco_diaria: parseFloat(document.getElementById('preco').value),
                    imagem: nomeArquivo
                })
                .eq('id', imovelId);

            if (dbError) throw dbError;

            msgDiv.innerHTML = `<div class="alert alert-success">Atualizado com sucesso!</div>`;
            setTimeout(() => window.location.href = 'painel.html', 1500);

        } catch (erro) {
            msgDiv.innerHTML = `<div class="alert alert-danger">Erro: ${erro.message}</div>`;
            btn.disabled = false;
            btn.innerText = "Salvar Alterações";
        }
    });

    carregarDados();
</script>
</body>
</html>

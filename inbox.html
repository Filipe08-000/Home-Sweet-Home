<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Mensagens - Home Sweet Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">Home Sweet Home</a>
        <a href="painel.html" class="btn btn-outline-dark btn-sm">Voltar ao Painel</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Minhas Mensagens</h2>
    
    <div class="card shadow border-0">
        <div class="list-group list-group-flush" id="lista-conversas">
            <div class="p-4 text-center text-muted">Carregando conversas...</div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://drlnbbodugxkndtpomfa.supabase.co'
    const supabaseKey = 'sb_publishable_uxQbUyjsM-DgKapQzvE32Q_ZUNBtdp1'
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function carregarInbox() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        // Pegamos o ID interno, pois as mensagens usam ele
        const { data: euDb } = await supabase.from('usuarios').select('id').eq('email', user.email).single();
        const meuIdInterno = euDb.id;

        // Busca todas as mensagens onde o usuário está envolvido
        const { data: msgs, error } = await supabase
            .from('mensagens')
            .select('*')
            .or(`remetente_id.eq.${meuIdInterno},destinatario_id.eq.${meuIdInterno}`)
            .order('data_envio', { ascending: false });

        const lista = document.getElementById('lista-conversas');
        lista.innerHTML = '';

        if (error || msgs.length === 0) {
            lista.innerHTML = '<div class="p-4 text-center text-muted">Nenhuma conversa encontrada.</div>';
            return;
        }

        // Agrupa as conversas por (ImovelID + ID do Outro Usuário)
        const conversas = {};
        
        msgs.forEach(msg => {
            const outroId = msg.remetente_id === meuIdInterno ? msg.destinatario_id : msg.remetente_id;
            const chave = `${msg.imovel_id}_${outroId}`;
            
            if (!conversas[chave]) {
                conversas[chave] = {
                    imovelId: msg.imovel_id,
                    outroId: outroId,
                    ultimaMsg: msg.texto,
                    data: msg.data_envio
                };
            }
        });

        // Renderiza a lista
        for (const chave in conversas) {
            const conv = conversas[chave];
            
            // Busca os nomes para ficar bonito
            const { data: imovel } = await supabase.from('imoveis').select('titulo').eq('id', conv.imovelId).single();
            const { data: outro } = await supabase.from('usuarios').select('nome').eq('id', conv.outroId).single();

            const dataFormatada = new Date(conv.data).toLocaleDateString('pt-BR');

            lista.innerHTML += `
                <a href="chat.html?imovel_id=${conv.imovelId}&destinatario_id=${conv.outroId}" class="list-group-item list-group-item-action p-3">
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <h6 class="mb-1 fw-bold text-dark">${outro?.nome || 'Usuário'} <span class="text-muted fw-normal">(${imovel?.titulo || 'Imóvel'})</span></h6>
                        <small class="text-muted">${dataFormatada}</small>
                    </div>
                    <p class="mb-1 text-secondary text-truncate" style="max-width: 80%;">${conv.ultimaMsg}</p>
                </a>
            `;
        }
    }

    carregarInbox();
</script>
</body>
</html>

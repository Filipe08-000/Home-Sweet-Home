<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Sweet Home - Encontre seu lar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">Home Sweet Home</a>
        
        <div class="d-flex align-items-center">
            <div id="guest-menu">
                <a href="cadastrar_imovel.html" class="btn btn-outline-dark me-3 d-none d-md-inline-block">Anuncie seu espaço</a>
                <a href="login.html" class="btn btn-dark">Entrar</a>
            </div>

            <div id="user-menu" class="d-none">
                <span id="user-name" class="me-3 fw-bold text-secondary">Olá, ...</span>
                
                <a href="inbox.html" class="btn btn-outline-primary me-2">
                    <i class="bi bi-chat-left-text-fill"></i> Mensagens
                </a>

                <a href="minhas_reservas.html" class="btn btn-outline-dark me-2 d-none d-md-inline-block">Hóspedes</a>
                <a href="minhas_viagens.html" class="btn btn-outline-dark me-2">Minhas Viagens</a>
                <a href="painel.html" class="btn btn-dark me-2">Painel Anfitrião</a>
                <button id="btn-sair" class="btn btn-danger">Sair</button>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row" id="lista-imoveis">
        </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://drlnbbodugxkndtpomfa.supabase.co'
    const supabaseKey = 'sb_publishable_uxQbUyjsM-DgKapQzvE32Q_ZUNBtdp1'
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function verificarAutenticacao() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            document.getElementById('guest-menu').classList.add('d-none');
            document.getElementById('user-menu').classList.remove('d-none');
            
            const nomeElement = document.getElementById('user-name');
            if (nomeElement) {
                nomeElement.innerText = `Olá, ${user.user_metadata?.nome || user.email}`;
            }
        }
    }

    document.getElementById('btn-sair')?.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.reload();
    });

    async function carregarImoveis() {
        const container = document.getElementById('lista-imoveis');
        if (!container) return;
        container.innerHTML = '';

        const { data: imoveis, error } = await supabase
            .from('imoveis')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        imoveis.forEach(imovel => {
            const imageUrl = imovel.imagem ? `${supabaseUrl}/storage/v1/object/public/imoveis-imagens/${imovel.imagem}` : 'https://via.placeholder.com/400x220?text=Sem+Imagem';
            const precoFormatado = parseFloat(imovel.preco_diaria).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const cardHtml = `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border-0">
                        <img src="${imageUrl}" class="card-img-top" alt="${imovel.titulo}" style="height: 220px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/400x220?text=Imagem+nao+encontrada'">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">${imovel.titulo}</h5>
                            <p class="card-text text-muted small">
                                <i class="bi bi-geo-alt-fill"></i> ${imovel.cidade}
                            </p>
                            <p class="card-text fw-bold text-danger fs-5">
                                R$ ${precoFormatado} <span class="text-muted fs-6 fw-normal">/ noite</span>
                            </p>
                            <a href="detalhes.html?id=${imovel.id}" class="btn btn-danger w-100">Ver Detalhes</a>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    verificarAutenticacao();
    carregarImoveis();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imóvel - Home Sweet Home</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    
    <style>
        #ui-datepicker-div { z-index: 9999 !important; }
        .ui-datepicker { background: #fff; border: 1px solid #ddd; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 8px; padding: 10px; }
        .imovel-img { height: 450px; object-fit: cover; border-radius: 12px; }
        .sticky-card { position: sticky; top: 20px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="index.html">Home Sweet Home</a>
        <a href="index.html" class="btn btn-outline-dark btn-sm">Voltar ao Início</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div id="loader" class="text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2 text-muted">Carregando detalhes do lar...</p>
    </div>

    <div id="main-content" class="row d-none">
        
        <div class="col-md-8">
            <img id="imovel-img" src="" class="img-fluid w-100 imovel-img mb-4" alt="Imóvel">
            
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h1 id="imovel-titulo" class="fw-bold mb-1"></h1>
                    <p id="imovel-cidade" class="text-muted fs-5"></p>
                </div>
                <div id="chat-btn-area"></div>
            </div>

            <hr>
            <h4 class="fw-bold">Sobre este espaço</h4>
            <p id="imovel-descricao" style="white-space: pre-wrap;" class="text-secondary"></p>
            <hr>

            <div class="mt-4">
                <h4 class="fw-bold">Avaliações (<span id="total-avaliacoes">0</span>) - ⭐ <span id="media-nota">0.0</span></h4>
                <div id="area-minha-avaliacao" class="d-none border p-3 rounded mb-4 bg-white shadow-sm">
                    <h6 class="fw-bold mb-3">O que você achou da sua estadia?</h6>
                    <form id="form-avaliacao">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <select id="nota" class="form-select" required>
                                    <option value="5">5 - Excelente</option>
                                    <option value="4">4 - Muito Bom</option>
                                    <option value="3">3 - Bom</option>
                                    <option value="2">2 - Regular</option>
                                    <option value="1">1 - Ruim</option>
                                </select>
                            </div>
                            <div class="col-md-9">
                                <textarea id="comentario" class="form-control" placeholder="Escreva um comentário (opcional)..." rows="1"></textarea>
                            </div>
                        </div>
                        <button type="submit" id="btn-enviar-av" class="btn btn-dark btn-sm mt-2">Enviar Avaliação</button>
                    </form>
                </div>
                <div id="lista-avaliacoes" class="list-group list-group-flush mt-3"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 p-4 sticky-card">
                <h3 class="fw-bold text-danger">R$ <span id="imovel-preco">0,00</span> <span class="fs-6 text-muted fw-normal">/ noite</span></h3>
                <hr>
                <div id="msg-reserva"></div>
                <form id="form-reserva">
                    <div class="mb-3">
                        <label class="small fw-bold text-uppercase text-muted">Check-in</label>
                        <input type="text" id="checkin" class="form-control" placeholder="AAAA-MM-DD" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold text-uppercase text-muted">Check-out</label>
                        <input type="text" id="checkout" class="form-control" placeholder="AAAA-MM-DD" required autocomplete="off">
                    </div>
                    <div class="d-flex justify-content-between mt-4 p-2 bg-light rounded">
                        <span class="fw-bold">Total estimado:</span>
                        <span id="total-display" class="text-success fw-bold">R$ 0,00</span>
                    </div>
                    <button type="submit" id="btn-reservar" class="btn btn-danger w-100 mt-4 py-2 fs-5 fw-bold">Reservar agora</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://drlnbbodugxkndtpomfa.supabase.co'
    const supabaseKey = 'sb_publishable_uxQbUyjsM-DgKapQzvE32Q_ZUNBtdp1'
    const supabase = createClient(supabaseUrl, supabaseKey)
    window.supabase = supabase;
    
    const urlParams = new URLSearchParams(window.location.search);
    const imovelId = urlParams.get('id');

    let precoDiaria = 0;
    let usuarioLogadoId = null;
    let datasBloqueadas = [];

    async function init() {
        if (!imovelId) { window.location.href = 'index.html'; return; }

        const { data: { user } } = await supabase.auth.getUser();
        let meuIdInterno = null;
        
        if (user) {
            usuarioLogadoId = user.id;
            const { data: uDb } = await supabase.from('usuarios').select('id').eq('email', user.email).single();
            if (uDb) meuIdInterno = uDb.id;
        }

        // 1. Carrega os dados básicos do imóvel
        const { data: imovel, error } = await supabase.from('imoveis').select('*').eq('id', imovelId).single();
        if (error || !imovel) { alert("Imóvel não encontrado!"); return; }

        precoDiaria = parseFloat(imovel.preco_diaria);

        document.getElementById('imovel-img').src = `${supabaseUrl}/storage/v1/object/public/imoveis-imagens/${imovel.imagem}`;
        document.getElementById('imovel-titulo').innerText = imovel.titulo;
        document.getElementById('imovel-cidade').innerText = imovel.cidade;
        document.getElementById('imovel-descricao').innerText = imovel.descricao;
        document.getElementById('imovel-preco').innerText = precoDiaria.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

        // 2. Mapeia e carrega datas indisponíveis (Bloqueio de concorrência)
        const { data: reservasExistentes } = await supabase
            .from('reservas')
            .select('data_inicio, data_fim')
            .eq('imovel_id', imovelId)
            .neq('status', 'Cancelada');

        if (reservasExistentes) {
            reservasExistentes.forEach(res => {
                let dIn = new Date(res.data_inicio + 'T12:00:00');
                let dFi = new Date(res.data_fim + 'T12:00:00');
                // Adiciona todos os dias do intervalo ao bloqueio (deixa o dia do checkout livre para nova entrada)
                while (dIn < dFi) {
                    let y = dIn.getFullYear();
                    let m = String(dIn.getMonth() + 1).padStart(2, '0');
                    let d = String(dIn.getDate()).padStart(2, '0');
                    datasBloqueadas.push(`${y}-${m}-${d}`);
                    dIn.setDate(dIn.getDate() + 1);
                }
            });
            // Atualiza os calendários com as novas datas travadas
            $("#checkin").datepicker("refresh");
            $("#checkout").datepicker("refresh");
        }

        // 3. Verifica permissão de avaliação
        let jaAlugou = false;
        if (usuarioLogadoId) {
            const idBusca = meuIdInterno || usuarioLogadoId;
            const { data: reservasUser } = await supabase
                .from('reservas')
                .select('id')
                .eq('imovel_id', imovelId)
                .or(`usuario_id.eq.${usuarioLogadoId},usuario_id.eq.${idBusca}`);
                
            if (reservasUser && reservasUser.length > 0) {
                jaAlugou = true;
            }
        }

        if (usuarioLogadoId && usuarioLogadoId !== imovel.dono_id) {
            document.getElementById('chat-btn-area').innerHTML = `
                <a href="chat.html?imovel_id=${imovelId}&destinatario_id=${imovel.dono_id}" class="btn btn-outline-danger">
                    <i class="bi bi-chat-dots"></i> Falar com Anfitrião
                </a>`;
                
            if (jaAlugou) {
                document.getElementById('area-minha-avaliacao').classList.remove('d-none');
            }
        }

        document.getElementById('loader').classList.add('d-none');
        document.getElementById('main-content').classList.remove('d-none');
        carregarAvaliacoes();
    }

    // CARREGAR AVALIAÇÕES COM NOME DO USUÁRIO
    async function carregarAvaliacoes() {
        const { data: avs, error } = await supabase.from('avaliacoes').select('*').eq('imovel_id', imovelId);
        const lista = document.getElementById('lista-avaliacoes');
        lista.innerHTML = '';
        
        if (error) { console.error(error); return; }

        if (avs && avs.length > 0) {
            let soma = 0;
            
            for (const av of avs) {
                const notaNum = parseInt(av.nota);
                soma += notaNum;
                
                // Busca de forma reativa o nome associado à avaliação na tabela pública de usuários
                let nomeUsuario = 'Hóspede';
                if (av.usuario_id) {
                    const { data: usr } = await supabase
                        .from('usuarios')
                        .select('nome')
                        .eq('id', av.usuario_id)
                        .maybeSingle();
                    if (usr && usr.nome) nomeUsuario = usr.nome;
                }

                lista.innerHTML += `
                    <div class="border-bottom py-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div class="fw-bold text-warning">⭐ ${notaNum} / 5</div>
                            <small class="text-muted fw-bold"><i class="bi bi-person-fill"></i> ${nomeUsuario}</small>
                        </div>
                        <div class="text-secondary" style="white-space: pre-wrap;">${av.comentario || 'Sem comentário'}</div>
                    </div>`;
            }
            const media = (soma / avs.length).toFixed(1);
            document.getElementById('media-nota').innerText = media;
            document.getElementById('total-avaliacoes').innerText = avs.length;
        } else {
            lista.innerHTML = '<div class="text-muted py-2">Nenhum hóspede avaliou este local ainda.</div>';
            document.getElementById('media-nota').innerText = "0.0";
            document.getElementById('total-avaliacoes').innerText = "0";
        }
    }

    // ENVIO DE NOVA AVALIAÇÃO
    document.getElementById('form-avaliacao').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!usuarioLogadoId) return;

        const btn = document.getElementById('btn-enviar-av');
        btn.disabled = true;
        btn.innerText = "Enviando...";

        const nota = parseInt(document.getElementById('nota').value);
        const comentario = document.getElementById('comentario').value;

        let idParaSalvar = usuarioLogadoId;
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            const { data: uDb } = await supabase.from('usuarios').select('id').eq('email', user.email).single();
            if (uDb) idParaSalvar = uDb.id;
        }

        const { error } = await supabase.from('avaliacoes').insert([{
            imovel_id: imovelId,
            usuario_id: idParaSalvar,
            nota: nota,
            comentario: comentario
        }]);

        if (error) {
            alert("Erro ao enviar avaliação: " + error.message);
        } else {
            alert("Sua avaliação foi salva! Muito obrigado.");
            document.getElementById('comentario').value = '';
            carregarAvaliacoes();
        }
        
        btn.disabled = false;
        btn.innerText = "Enviar Avaliação";
    });

    // FUNÇÃO QUE DETECTA E TRAVA DIAS JÁ RESERVADOS NO CALENDÁRIO
    function desabilitarDatas(date) {
        let y = date.getFullYear();
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        let dataStr = `${y}-${m}-${d}`;
        
        if (datasBloqueadas.includes(dataStr)) {
            return [false, "", "Indisponível"];
        }
        return [true, "", ""];
    }

    function calc() {
        const d1 = $("#checkin").datepicker('getDate');
        const d2 = $("#checkout").datepicker('getDate');
        if (d1 && d2 && d2 > d1) {
            const dias = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
            const total = dias * precoDiaria;
            $("#total-display").text("R$ " + total.toLocaleString('pt-BR', { minimumFractionDigits: 2 }));
            return { dias, total };
        }
        return null;
    }

    // Inicialização segura do Datepicker com desativação dinâmica
    $(function() {
        $("#checkin").datepicker({ 
            minDate: 0, 
            dateFormat: 'yy-mm-dd', 
            beforeShowDay: desabilitarDatas,
            onSelect: function() { calc(); } 
        }).on('change', function() { calc(); });

        $("#checkout").datepicker({ 
            minDate: 1, 
            dateFormat: 'yy-mm-dd', 
            beforeShowDay: desabilitarDatas,
            onSelect: function() { calc(); } 
        }).on('change', function() { calc(); });
    });

    // ENVIO DA RESERVA COM CHECAGEM ANTI-CONCORRÊNCIA EM TEMPO REAL
    document.getElementById('form-reserva').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!usuarioLogadoId) { window.location.href = 'login.html'; return; }

        const res = calc();
        if (!res) { alert("Datas inválidas"); return; }

        const btn = document.getElementById('btn-reservar');
        btn.disabled = true;
        btn.innerText = "Processando...";

        const checkinVal = $("#checkin").val();
        const checkoutVal = $("#checkout").val();

        // Checagem de última hora contra concorrência dupla antes de injetar no banco
        const { data: conflitos } = await supabase
            .from('reservas')
            .select('data_inicio, data_fim')
            .eq('imovel_id', imovelId)
            .neq('status', 'Cancelada');

        let dataOcupadaDeUltimaHora = false;
        if (conflitos) {
            for (let r of conflitos) {
                if (checkinVal < r.data_fim && checkoutVal > r.data_inicio) {
                    dataOcupadaDeUltimaHora = true;
                    break;
                }
            }
        }

        if (dataOcupadaDeUltimaHora) {
            alert("Desculpe! Esse período acabou de ser reservado por outro usuário. Escolha novas datas.");
            btn.disabled = false;
            btn.innerText = "Reservar agora";
            // Força recarregamento da página para atualizar o calendário
            window.location.reload();
            return;
        }

        const { error } = await supabase.from('reservas').insert([{
            imovel_id: imovelId,
            usuario_id: usuarioLogadoId,
            data_inicio: checkinVal,
            data_fim: checkoutVal,
            dias: res.dias,
            valor_total: res.total,
            status: 'Confirmada',
            metodo_pagamento: 'Combinar'
        }]);

        if (error) { 
            alert("Erro: " + error.message); 
            btn.disabled = false; 
            btn.innerText = "Reservar agora";
        } else { 
            alert("Reserva feita com sucesso!");
            window.location.href = 'minhas_viagens.html'; 
        }
    });

    init();
</script>
</body>
</html>
